name: Deploy Data Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_WORKING_DIR: infra
  GLUE_SCRIPT_LOCAL_PATH: src/transformations/transform.py

concurrency:
  group: deploy-pipeline-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=data-pipeline/${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="environment=${{ github.event.inputs.environment || 'dev' }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -out=tfplan
        continue-on-error: false

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-${{ github.event.inputs.environment || 'dev' }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    outputs:
      glue_script_bucket: ${{ steps.tf_outputs.outputs.glue_script_bucket }}
      glue_script_key: ${{ steps.tf_outputs.outputs.glue_script_key }}
      glue_job_name: ${{ steps.tf_outputs.outputs.glue_job_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=data-pipeline/${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Download Plan Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: tfplan-${{ github.event.inputs.environment || 'dev' }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Read Terraform outputs
        id: tf_outputs
        run: |
          echo "glue_script_bucket=$(terraform output -raw glue_script_bucket)" >> "$GITHUB_OUTPUT"
          echo "glue_script_key=$(terraform output -raw glue_script_key)" >> "$GITHUB_OUTPUT"
          echo "glue_job_name=$(terraform output -raw glue_job_name)" >> "$GITHUB_OUTPUT"

  deploy-glue-script:
    name: Deploy Glue PySpark Script
    needs: terraform-apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate script exists
        run: |
          if [ ! -f "${{ env.GLUE_SCRIPT_LOCAL_PATH }}" ]; then
            echo "Glue script not found at ${{ env.GLUE_SCRIPT_LOCAL_PATH }}"
            exit 1
          fi

      - name: Upload Glue script to S3
        run: |
          aws s3 cp "${{ env.GLUE_SCRIPT_LOCAL_PATH }}" \
            "s3://${{ needs.terraform-apply.outputs.glue_script_bucket }}/${{ needs.terraform-apply.outputs.glue_script_key }}"

      - name: Update Glue job script location
        run: |
          aws glue get-job --job-name "${{ needs.terraform-apply.outputs.glue_job_name }}" > /dev/null
          aws glue update-job \
            --job-name "${{ needs.terraform-apply.outputs.glue_job_name }}" \
            --job-update "Command={Name=glueetl,ScriptLocation=s3://${{ needs.terraform-apply.outputs.glue_script_bucket }}/${{ needs.terraform-apply.outputs.glue_script_key }},PythonVersion=3},Role=$(aws glue get-job --job-name '${{ needs.terraform-apply.outputs.glue_job_name }}' --query 'Job.Role' --output text)"

      - name: Trigger Glue job smoke start (optional dry validation)
        run: |
          aws glue get-job --job-name "${{ needs.terraform-apply.outputs.glue_job_name }}" \
            --query 'Job.{Name:Name,Script:Command.ScriptLocation}' \
            --output table