name: Deploy Energy ETL Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (e.g. dev, staging, prod)"
        required: true
        default: "dev"

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TF_WORKING_DIR: infra
  AWS_REGION: ${{ secrets.AWS_REGION }}
  GLUE_JOB_NAME: energy-etl-glue-job
  SCRIPT_S3_URI: s3://multi-agent-pipeline-dev-raw-data/scripts/transform.py
  TRANSFORM_SCRIPT: src/transformations/transform.py

jobs:
  lint:
    name: Lint & Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -out=tfplan \
            -var="environment=${{ github.event.inputs.environment || 'dev' }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -input=false

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tfplan-${{ github.event.inputs.environment || 'dev' }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 30
          if-no-files-found: error

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Download Terraform plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444306234a4f8c2f5b07b371 # v4.1.8
        with:
          name: tfplan-${{ github.event.inputs.environment || 'dev' }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan

      - name: Upload Glue transformation script to S3
        run: |
          aws s3 cp "${{ env.TRANSFORM_SCRIPT }}" "${{ env.SCRIPT_S3_URI }}"
          echo "Uploaded ${{ env.TRANSFORM_SCRIPT }} to ${{ env.SCRIPT_S3_URI }}"

      - name: Trigger Glue ETL job
        run: |
          JOB_RUN_ID=$(aws glue start-job-run \
            --job-name "${{ env.GLUE_JOB_NAME }}" \
            --query 'JobRunId' \
            --output text)
          echo "Glue job triggered. JobRunId: ${JOB_RUN_ID}"
          echo "GLUE_JOB_RUN_ID=${JOB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Wait for Glue job to complete
        run: |
          echo "Waiting for Glue job run ${GLUE_JOB_RUN_ID} to finish..."
          for i in $(seq 1 60); do
            STATUS=$(aws glue get-job-run \
              --job-name "${{ env.GLUE_JOB_NAME }}" \
              --run-id "${GLUE_JOB_RUN_ID}" \
              --query 'JobRun.JobRunState' \
              --output text)
            echo "  Attempt ${i}/60 - status: ${STATUS}"
            case "${STATUS}" in
              SUCCEEDED)
                echo "Glue job completed successfully."
                exit 0
                ;;
              FAILED|ERROR|TIMEOUT|STOPPED)
                echo "Glue job ended with status: ${STATUS}"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for Glue job to complete."
          exit 1