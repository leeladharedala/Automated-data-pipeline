name: Deploy Data Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "us-east-1"
      run_glue_job:
        description: "Trigger Glue job after apply"
        required: false
        type: boolean
        default: false
      run_tests:
        description: "Run data-eng tests after apply"
        required: false
        type: boolean
        default: true

env:
  TF_WORKING_DIR: infra
  AWS_REGION: ${{ inputs.aws_region || 'us-east-1' }}
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint & Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-lint-${{ env.ENVIRONMENT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Cache Terraform providers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: terraform-providers-${{ runner.os }}-${{ env.ENVIRONMENT }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.ENVIRONMENT }}-

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="backend-configs/${{ env.ENVIRONMENT }}.hcl" \
            -input=false

      - name: Terraform fmt check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  plan:
    name: Terraform Plan
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      plan-artifact: tfplan-${{ env.ENVIRONMENT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-plan-${{ env.ENVIRONMENT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Cache Terraform providers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: terraform-providers-${{ runner.os }}-${{ env.ENVIRONMENT }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.ENVIRONMENT }}-

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="backend-configs/${{ env.ENVIRONMENT }}.hcl" \
            -input=false

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 30

  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-apply-${{ env.ENVIRONMENT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Cache Terraform providers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: terraform-providers-${{ runner.os }}-${{ env.ENVIRONMENT }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.ENVIRONMENT }}-

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="backend-configs/${{ env.ENVIRONMENT }}.hcl" \
            -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan

      - name: Get Glue job name output
        id: tf_outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "glue_job_name=$(terraform output -raw glue_job_name)" >> "$GITHUB_OUTPUT"

      - name: Trigger Glue job
        if: ${{ inputs.run_glue_job == true }}
        run: |
          JOB_RUN_ID=$(aws glue start-job-run \
            --job-name "${{ steps.tf_outputs.outputs.glue_job_name }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'JobRunId' --output text)
          echo "Started Glue job run: $JOB_RUN_ID"
          aws glue wait job-run-complete \
            --job-name "${{ steps.tf_outputs.outputs.glue_job_name }}" \
            --run-id "$JOB_RUN_ID" \
            --region "${{ env.AWS_REGION }}" || true
          STATUS=$(aws glue get-job-run \
            --job-name "${{ steps.tf_outputs.outputs.glue_job_name }}" \
            --run-id "$JOB_RUN_ID" \
            --region "${{ env.AWS_REGION }}" \
            --query 'JobRun.JobRunState' --output text)
          echo "Glue job run status: $STATUS"
          if [ "$STATUS" != "SUCCEEDED" ]; then
            echo "Glue job run did not succeed (status: $STATUS)"
            exit 1
          fi

      - name: Set up Python
        if: ${{ inputs.run_tests == true }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        if: ${{ inputs.run_tests == true }}
        run: |
          python -m pip install --upgrade pip
          if [ -f data_eng/requirements-test.txt ]; then
            pip install -r data_eng/requirements-test.txt
          else
            pip install pytest boto3 pandas pyarrow
          fi

      - name: Run data-eng tests
        if: ${{ inputs.run_tests == true }}
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -d tests/data_eng ]; then
            pytest tests/data_eng -v
          else
            echo "No data-eng tests found, skipping."
          fi