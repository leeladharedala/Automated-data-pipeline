name: Deploy Energy ETL Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      aws_region:
        description: "AWS region to deploy into"
        required: false
        default: "us-east-1"
        type: string
      glue_job_name:
        description: "Name of the target Glue job"
        required: false
        default: "multi-agent-pipeline-dev-transform-job"
        type: string
      trigger_glue_job:
        description: "Trigger the Glue job run after deploy"
        required: false
        default: true
        type: boolean

env:
  TF_WORKING_DIR: infra
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  AWS_REGION: ${{ inputs.aws_region || 'us-east-1' }}
  GLUE_JOB_NAME: ${{ inputs.glue_job_name || 'multi-agent-pipeline-dev-transform-job' }}
  RAW_DATA_BUCKET: multi-agent-pipeline-dev-raw-data
  TRANSFORM_SCRIPT_PATH: src/transformations/transform.py

concurrency:
  group: energy-etl-deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest

      - name: Run data-eng-agent test suite
        run: |
          pytest tests/ --maxfail=1 --disable-warnings -v

  lint:
    name: Terraform Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init (validate only, no backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials (OIDC preferred)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="backend-configs/${{ env.ENVIRONMENT }}.tfbackend"

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var-file="environments/${{ env.ENVIRONMENT }}.tfvars" \
            -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tfplan-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 30

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: plan
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials (OIDC preferred)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="backend-configs/${{ env.ENVIRONMENT }}.tfbackend"

      - name: Download plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: tfplan-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan

      - name: Upload PySpark transformation script to Glue S3 location
        run: |
          aws s3 cp "${{ env.TRANSFORM_SCRIPT_PATH }}" \
            "s3://${{ env.RAW_DATA_BUCKET }}/glue-scripts/transform.py"

      - name: Verify Glue job exists
        run: |
          aws glue get-job --job-name "${{ env.GLUE_JOB_NAME }}" > /dev/null
          echo "Glue job ${{ env.GLUE_JOB_NAME }} verified."

      - name: Trigger Glue job run
        if: ${{ inputs.trigger_glue_job == true || inputs.trigger_glue_job == null }}
        run: |
          RUN_ID=$(aws glue start-job-run \
            --job-name "${{ env.GLUE_JOB_NAME }}" \
            --query 'JobRunId' --output text)
          echo "Started Glue job run: $RUN_ID"
          echo "GLUE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Wait for Glue job run to complete
        if: ${{ inputs.trigger_glue_job == true || inputs.trigger_glue_job == null }}
        run: |
          STATUS="RUNNING"
          ATTEMPTS=0
          MAX_ATTEMPTS=60
          while [[ "$STATUS" == "RUNNING" || "$STATUS" == "STARTING" ]]; do
            if [[ $ATTEMPTS -ge $MAX_ATTEMPTS ]]; then
              echo "Timed out waiting for Glue job to complete."
              exit 1
            fi
            sleep 30
            STATUS=$(aws glue get-job-run \
              --job-name "${{ env.GLUE_JOB_NAME }}" \
              --run-id "${{ env.GLUE_RUN_ID }}" \
              --query 'JobRun.JobRunState' --output text)
            echo "Glue job run status: $STATUS"
            ATTEMPTS=$((ATTEMPTS+1))
          done
          if [[ "$STATUS" != "SUCCEEDED" ]]; then
            echo "Glue job run finished with non-success status: $STATUS"
            exit 1
          fi
          echo "Glue job run succeeded."