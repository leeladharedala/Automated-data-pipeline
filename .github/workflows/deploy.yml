name: Deploy Data Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      aws_region:
        description: "AWS region to deploy into"
        required: false
        default: "us-east-1"
        type: string

env:
  TF_WORKING_DIR: infra
  SRC_DIR: src
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  AWS_REGION_INPUT: ${{ github.event.inputs.aws_region || 'us-east-1' }}

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  test:
    name: Run PySpark Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.SRC_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov

      - name: Run pytest
        run: |
          pytest --maxfail=1 --disable-warnings --junitxml=pytest-report.xml -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: pytest-report-${{ env.ENVIRONMENT }}
          path: ${{ env.SRC_DIR }}/pytest-report.xml
          retention-days: 30

  lint:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION_INPUT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: ${{ runner.os }}-terraform-providers-${{ env.ENVIRONMENT }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-${{ env.ENVIRONMENT }}-
            ${{ runner.os }}-terraform-providers-

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="backend-configs/${{ env.ENVIRONMENT }}.backend.hcl"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION_INPUT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: ${{ runner.os }}-terraform-providers-${{ env.ENVIRONMENT }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-${{ env.ENVIRONMENT }}-
            ${{ runner.os }}-terraform-providers-

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="backend-configs/${{ env.ENVIRONMENT }}.backend.hcl"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="aws_region=${{ secrets.AWS_REGION || env.AWS_REGION_INPUT }}" \
            -var-file="tfvars/${{ env.ENVIRONMENT }}.tfvars" \
            -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tfplan-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 90

  apply:
    name: Terraform Apply & Deploy Glue Script
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION_INPUT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: ${{ runner.os }}-terraform-providers-${{ env.ENVIRONMENT }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-${{ env.ENVIRONMENT }}-
            ${{ runner.os }}-terraform-providers-

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="backend-configs/${{ env.ENVIRONMENT }}.backend.hcl"

      - name: Download plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: tfplan-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply tfplan

      - name: Capture Terraform outputs
        id: tf_outputs
        run: |
          echo "glue_script_bucket=$(terraform output -raw glue_script_bucket)" >> "$GITHUB_OUTPUT"
          echo "glue_script_prefix=$(terraform output -raw glue_script_prefix 2>/dev/null || echo 'scripts')" >> "$GITHUB_OUTPUT"
          echo "glue_job_name=$(terraform output -raw glue_job_name)" >> "$GITHUB_OUTPUT"

      - name: Sync Glue job script(s) to S3
        working-directory: ${{ github.workspace }}
        run: |
          aws s3 sync ./src/jobs "s3://${{ steps.tf_outputs.outputs.glue_script_bucket }}/${{ steps.tf_outputs.outputs.glue_script_prefix }}/" \
            --exclude "tests/*" \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --delete

      - name: Trigger Glue job start (optional smoke validation)
        if: github.event_name == 'workflow_dispatch'
        run: |
          aws glue start-job-run --job-name "${{ steps.tf_outputs.outputs.glue_job_name }}" \
            --arguments='{"--job-language":"python"}' \
            || echo "Glue job start skipped or failed non-fatally; check console."