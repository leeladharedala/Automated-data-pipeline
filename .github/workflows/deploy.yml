name: Deploy Data Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      aws_region:
        description: "AWS region to deploy into"
        required: false
        default: "us-east-1"
        type: string

env:
  TF_WORKING_DIR: infra
  SRC_DIR: src/transformations
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  AWS_REGION: ${{ github.event.inputs.aws_region || secrets.AWS_REGION }}

concurrency:
  group: deploy-data-pipeline-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Init/Plan/Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    outputs:
      glue_script_bucket: ${{ steps.tf_outputs.outputs.glue_script_bucket }}
      glue_script_key_prefix: ${{ steps.tf_outputs.outputs.glue_script_key_prefix }}
      glue_job_name: ${{ steps.tf_outputs.outputs.glue_job_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=data-pipeline/${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan
        continue-on-error: false

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 30

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

      - name: Extract Terraform Outputs
        id: tf_outputs
        run: |
          echo "glue_script_bucket=$(terraform output -raw glue_script_bucket)" >> "$GITHUB_OUTPUT"
          echo "glue_script_key_prefix=$(terraform output -raw glue_script_key_prefix)" >> "$GITHUB_OUTPUT"
          echo "glue_job_name=$(terraform output -raw glue_job_name)" >> "$GITHUB_OUTPUT"

  deploy-glue-script:
    name: Deploy PySpark Script to Glue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: terraform
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync transformation scripts to S3
        run: |
          aws s3 sync "${{ env.SRC_DIR }}" \
            "s3://${{ needs.terraform.outputs.glue_script_bucket }}/${{ needs.terraform.outputs.glue_script_key_prefix }}" \
            --delete \
            --exact-timestamps

      - name: Verify Glue job references latest script
        run: |
          aws glue get-job --job-name "${{ needs.terraform.outputs.glue_job_name }}" \
            --query 'Job.Command.ScriptLocation' --output text

      - name: Trigger Glue job validation run (dry check)
        run: |
          echo "Glue job '${{ needs.terraform.outputs.glue_job_name }}' is up to date with the latest script."
          echo "Script deployed from ${{ env.SRC_DIR }} to s3://${{ needs.terraform.outputs.glue_script_bucket }}/${{ needs.terraform.outputs.glue_script_key_prefix }}"