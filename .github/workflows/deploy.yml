name: Deploy Data Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      aws_region:
        description: "AWS region to deploy into"
        required: true
        default: "us-east-1"
        type: string
      bucket_name:
        description: "S3 bucket name used for raw/transformed data and script storage"
        required: true
        default: "multi-agent-pipeline-dev-raw-data"
        type: string

env:
  TF_WORKING_DIR: infra
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  AWS_REGION: ${{ github.event.inputs.aws_region || 'us-east-1' }}
  BUCKET_NAME: ${{ github.event.inputs.bucket_name || 'multi-agent-pipeline-dev-raw-data' }}
  GLUE_SCRIPT_PREFIX: glue-scripts

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Lint & Test PySpark Transformations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: src/transformations
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 pyspark==3.5.1

      - name: Lint with flake8
        working-directory: src/transformations
        run: |
          flake8 . --count --max-line-length=120 --statistics

      - name: Run pytest
        working-directory: src/transformations
        run: |
          pytest -v --maxfail=1 --disable-warnings

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    outputs:
      plan-artifact: tfplan-${{ env.ENVIRONMENT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Cache Terraform plugins
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="backend-${{ env.ENVIRONMENT }}.hcl"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="bucket_name=${{ env.BUCKET_NAME }}" \
            -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 30

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Cache Terraform plugins
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="backend-${{ env.ENVIRONMENT }}.hcl"

      - name: Download plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan

      - name: Package PySpark transformation script
        run: |
          mkdir -p dist
          cp src/transformations/*.py dist/

      - name: Upload transformation script to S3
        run: |
          aws s3 cp ./dist/ "s3://${{ env.BUCKET_NAME }}/${{ env.GLUE_SCRIPT_PREFIX }}/" \
            --recursive \
            --region "${{ env.AWS_REGION }}"

      - name: Verify uploaded script
        run: |
          aws s3 ls s3://${{ env.BUCKET_NAME }}/${{ env.GLUE_SCRIPT_PREFIX }}/ --region ${{ env.AWS_REGION }}