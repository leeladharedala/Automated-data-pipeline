name: Destroy Data Pipeline Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      aws_region:
        description: "AWS region of the deployed infrastructure"
        required: true
        default: "us-east-1"
        type: string
      bucket_name:
        description: "S3 bucket name used for raw/transformed data and script storage"
        required: true
        default: "multi-agent-pipeline-dev-raw-data"
        type: string
      confirmation:
        description: 'Type "destroy-<environment>" (e.g. destroy-dev) to confirm'
        required: true
        type: string

env:
  TF_WORKING_DIR: infra
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  AWS_REGION: ${{ github.event.inputs.aws_region }}
  BUCKET_NAME: ${{ github.event.inputs.bucket_name }}

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  validate-confirmation:
    name: Validate Confirmation Input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check confirmation string matches expected value
        run: |
          expected="destroy-${{ github.event.inputs.environment }}"
          provided="${{ github.event.inputs.confirmation }}"
          if [ "$provided" != "$expected" ]; then
            echo "::error::Confirmation string '$provided' does not match required value '$expected'. Aborting."
            exit 1
          fi
          echo "Confirmation validated: $provided"

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: validate-confirmation
    timeout-minutes: 60
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Cache Terraform plugins
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ env.ENVIRONMENT }}-

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="backend-${{ env.ENVIRONMENT }}.hcl"

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan (Destroy)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -destroy \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="bucket_name=${{ env.BUCKET_NAME }}" \
            -out=tfplan

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tfplan-destroy-${{ env.ENVIRONMENT }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 30

      - name: Terraform Apply (Destroy)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan

      - name: Verify no remaining managed resources
        id: state_check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          remaining=$(terraform state list | wc -l)
          echo "remaining_resources=$remaining" >> "$GITHUB_OUTPUT"
          echo "Remaining resources in state: $remaining"

      - name: Clean up Terraform state (fully destroyed only)
        if: steps.state_check.outputs.remaining_resources == '0'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "All resources destroyed. Removing local state and plan artifacts."
          rm -f terraform.tfstate terraform.tfstate.backup tfplan
          rm -rf .terraform

      - name: Cleanup warning if resources remain
        if: steps.state_check.outputs.remaining_resources != '0'
        run: |
          echo "::warning::Terraform state still contains resources after destroy. Skipping state cleanup for safety."