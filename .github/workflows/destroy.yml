name: Destroy Data Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm:
        description: 'Type "destroy-<environment>" to confirm (e.g. destroy-dev)'
        required: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_WORKING_DIR: infra

concurrency:
  group: deploy-pipeline-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  validate-confirmation:
    name: Validate Confirmation Input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check confirmation string
        run: |
          expected="destroy-${{ github.event.inputs.environment }}"
          provided="${{ github.event.inputs.confirm }}"
          if [ "$provided" != "$expected" ]; then
            echo "Confirmation string does not match. Expected '$expected', got '$provided'."
            exit 1
          fi
          echo "Confirmation validated for environment: ${{ github.event.inputs.environment }}"

  terraform-destroy-plan:
    name: Terraform Destroy Plan
    needs: validate-confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=data-pipeline/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy Plan
        run: |
          terraform plan -destroy \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -out=tfplan

      - name: Upload Destroy Plan Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: destroy-tfplan-${{ github.event.inputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

  terraform-destroy-apply:
    name: Terraform Destroy Apply
    needs: terraform-destroy-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=data-pipeline/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Download Destroy Plan Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: destroy-tfplan-${{ github.event.inputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply (Destroy)
        run: terraform apply tfplan

      - name: Verify no resources remain
        id: verify
        run: |
          remaining=$(terraform state list | wc -l)
          echo "remaining_resources=$remaining" >> "$GITHUB_OUTPUT"
          echo "Remaining resources in state: $remaining"

      - name: Clean up Terraform state (fully destroyed only)
        if: steps.verify.outputs.remaining_resources == '0'
        run: |
          echo "No resources remain in state. Removing remote state object."
          aws s3 rm "s3://${{ secrets.TF_STATE_BUCKET }}/data-pipeline/${{ github.event.inputs.environment }}/terraform.tfstate"

      - name: Retain state (resources still present)
        if: steps.verify.outputs.remaining_resources != '0'
        run: |
          echo "Some resources still remain in state. Skipping state cleanup for safety."
          terraform state list