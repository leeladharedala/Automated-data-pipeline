name: Destroy Energy ETL Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      confirmation:
        description: "Type 'destroy-<environment>' to confirm (e.g. destroy-dev)"
        required: true
        type: string
      remove_state:
        description: "Remove Terraform remote state after destroy?"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  TF_DIR: infra
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  GLUE_JOB_NAME: energy-etl-glue-job

permissions:
  id-token: write
  contents: read

jobs:
  validate-confirmation:
    name: Validate Destroy Confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check confirmation string
        run: |
          EXPECTED="destroy-${{ github.event.inputs.environment }}"
          PROVIDED="${{ github.event.inputs.confirmation }}"
          if [ "$PROVIDED" != "$EXPECTED" ]; then
            echo "ERROR: Expected '$EXPECTED', got '$PROVIDED'"
            exit 1
          fi
          echo "Confirmation validated."

  plan-destroy:
    name: Terraform Plan Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-confirmation
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="key=${{ env.ENVIRONMENT }}/terraform.tfstate" -backend-config="region=us-east-1" -input=false

      - name: Terraform Plan Destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -destroy -var="environment=${{ env.ENVIRONMENT }}" -var="aws_region=us-east-1" -out=tfplan -input=false

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-destroy-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 30
          if-no-files-found: error

  apply-destroy:
    name: Terraform Apply Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan-destroy
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="key=${{ env.ENVIRONMENT }}/terraform.tfstate" -backend-config="region=us-east-1" -input=false

      - name: Download destroy plan artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: tfplan-destroy-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: ${{ env.TF_DIR }}

      - name: Terraform Apply Destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan

      - name: Summarize destruction
        if: always()
        run: |
          echo "## Destroy Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY