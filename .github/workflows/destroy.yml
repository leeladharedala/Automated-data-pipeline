name: Destroy Energy ETL Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy (dev, staging, prod)"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      confirmation:
        description: 'Type "destroy-<environment>" (e.g. destroy-dev) to confirm'
        required: true
        type: string
      remove_state:
        description: "Remove Terraform state file from S3 after destroy?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  TF_WORKING_DIR: infra
  AWS_REGION: ${{ secrets.AWS_REGION }}
  SCRIPTS_BUCKET: multi-agent-pipeline-dev-raw-data
  GLUE_SCRIPT_KEY: scripts/transform.py

jobs:
  validate-confirmation:
    name: Validate Destroy Confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check confirmation string
        run: |
          EXPECTED="destroy-${{ github.event.inputs.environment }}"
          PROVIDED="${{ github.event.inputs.confirmation }}"
          if [ "$PROVIDED" != "$EXPECTED" ]; then
            echo "ERROR: Confirmation mismatch. Expected: $EXPECTED, Got: $PROVIDED"
            exit 1
          fi
          echo "Confirmation validated."

  plan-destroy:
    name: Terraform Plan Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-confirmation
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET || 'multi-agent-pipeline-dev-raw-data' }}" \
            -backend-config="key=terraform/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -input=false

      - name: Terraform Plan Destroy
        run: |
          terraform plan \
            -destroy \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan \
            -input=false

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-destroy-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 30
          if-no-files-found: error

  apply-destroy:
    name: Terraform Apply Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan-destroy
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET || 'multi-agent-pipeline-dev-raw-data' }}" \
            -backend-config="key=terraform/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -input=false

      - name: Download destroy plan artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: tfplan-destroy-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply Destroy
        run: terraform apply -input=false tfplan

      - name: Remove Glue script from S3
        if: success()
        run: |
          aws s3 rm s3://${{ env.SCRIPTS_BUCKET }}/${{ env.GLUE_SCRIPT_KEY }} \
            --region ${{ env.AWS_REGION }} || echo "Script already removed."

      - name: Remove Terraform state from S3
        if: success() && github.event.inputs.remove_state == 'true'
        run: |
          STATE_KEY="terraform/${{ github.event.inputs.environment }}/terraform.tfstate"
          STATE_BUCKET="${{ secrets.TF_STATE_BUCKET || 'multi-agent-pipeline-dev-raw-data' }}"
          aws s3 rm s3://${STATE_BUCKET}/${STATE_KEY} --region ${{ env.AWS_REGION }} || true