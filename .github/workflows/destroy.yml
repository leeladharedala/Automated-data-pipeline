name: Destroy Energy ETL Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        type: choice
        options:
          - production
      confirmation:
        description: "Type 'destroy-production' to confirm destruction"
        required: true
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-confirmation:
    name: Validate Destroy Confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check confirmation string
        run: |
          EXPECTED="destroy-${{ github.event.inputs.environment }}"
          ACTUAL="${{ github.event.inputs.confirmation }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Confirmation string mismatch."
            echo "::error::Expected: '$EXPECTED'"
            echo "::error::Got:      '$ACTUAL'"
            exit 1
          fi
          echo "Confirmation validated."

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate-confirmation
    environment: ${{ github.event.inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Destroy
        working-directory: infra
        run: terraform destroy -auto-approve -input=false

      - name: Destroy Summary
        if: always()
        run: |
          echo "## Destroy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ github.event.inputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"