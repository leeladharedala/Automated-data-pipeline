name: Destroy Energy ETL Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy (e.g., dev, staging, prod)"
        required: true
        default: "dev"
      confirmation:
        description: "Type 'destroy-<environment>' to confirm (e.g., destroy-dev)"
        required: true

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  TF_WORKING_DIR: infra

permissions:
  id-token: write
  contents: read

jobs:
  validate-confirmation:
    name: Validate Destroy Confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check confirmation string
        run: |
          EXPECTED="destroy-${{ github.event.inputs.environment }}"
          ACTUAL="${{ github.event.inputs.confirmation }}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "ERROR: Confirmation mismatch. Expected '${EXPECTED}', got '${ACTUAL}'."
            exit 1
          fi
          echo "Confirmation validated."

  plan-destroy:
    name: Terraform Destroy Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-confirmation
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate"

      - name: Terraform Destroy Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -destroy \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -out=tfplan-destroy -input=false

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-destroy-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan-destroy
          retention-days: 30

  apply-destroy:
    name: Terraform Apply Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan-destroy
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate"

      - name: Download destroy plan artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: tfplan-destroy-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan-destroy

      - name: Summary
        if: always()
        run: |
          echo "## Destroy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ github.event.inputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered By | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"