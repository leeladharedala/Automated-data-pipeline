name: Destroy Data Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      confirmation:
        description: 'Type "destroy-<environment>" to confirm (e.g. destroy-dev)'
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_WORKING_DIR: infra
  ENVIRONMENT: ${{ github.event.inputs.environment }}

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  validate-input:
    name: Validate Confirmation Input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check confirmation string
        run: |
          expected="destroy-${{ github.event.inputs.environment }}"
          provided="${{ github.event.inputs.confirmation }}"
          if [ "$provided" != "$expected" ]; then
            echo "ERROR: Confirmation string does not match. Expected '$expected', got '$provided'."
            exit 1
          fi
          echo "Confirmation validated for environment: ${{ github.event.inputs.environment }}"

  terraform-destroy-plan:
    name: Terraform Destroy Plan
    needs: validate-input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: terraform-providers-${{ runner.os }}-${{ env.ENVIRONMENT }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.ENVIRONMENT }}-

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="backend-configs/${{ env.ENVIRONMENT }}.hcl"

      - name: Terraform Destroy Plan
        run: |
          terraform plan -destroy -input=false -out=tfplan \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}"

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tfplan-destroy-${{ env.ENVIRONMENT }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 90

  terraform-destroy-apply:
    name: Terraform Destroy Apply
    needs: terraform-destroy-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: terraform-providers-${{ runner.os }}-${{ env.ENVIRONMENT }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.ENVIRONMENT }}-

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="backend-configs/${{ env.ENVIRONMENT }}.hcl"

      - name: Download destroy plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: tfplan-destroy-${{ env.ENVIRONMENT }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Destroy Apply
        run: terraform apply -input=false tfplan

      - name: Verify resources fully destroyed
        id: verify
        run: |
          remaining=$(terraform state list || true)
          if [ -z "$remaining" ]; then
            echo "All resources destroyed. State is empty."
            echo "fully_destroyed=true" >> "$GITHUB_OUTPUT"
          else
            echo "WARNING: Some resources remain in state:"
            echo "$remaining"
            echo "fully_destroyed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up Terraform state (only if fully destroyed)
        if: ${{ steps.verify.outputs.fully_destroyed == 'true' }}
        run: |
          echo "Removing local Terraform state artifacts for ${{ env.ENVIRONMENT }}..."
          rm -f terraform.tfstate terraform.tfstate.backup tfplan
          echo "Note: If using a remote backend (S3), the empty state file remains as the source of truth."
          echo "Consider deleting the remote state object for ${{ env.ENVIRONMENT }} manually or via a backend lifecycle policy if it is no longer needed."

      - name: Upload cleanup summary
        if: always()
        run: |
          echo "Destroy run summary for environment: ${{ env.ENVIRONMENT }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Fully destroyed: ${{ steps.verify.outputs.fully_destroyed }}" >> "$GITHUB_STEP_SUMMARY"