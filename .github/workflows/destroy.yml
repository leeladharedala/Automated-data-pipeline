name: Destroy Data Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      aws_region:
        description: "AWS region of the deployed infrastructure"
        required: false
        default: "us-east-1"
        type: string
      confirmation:
        description: 'Type "destroy-<environment>" (e.g. destroy-dev) to confirm'
        required: true
        type: string

env:
  TF_WORKING_DIR: infra
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  AWS_REGION_INPUT: ${{ github.event.inputs.aws_region || 'us-east-1' }}

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  validate-confirmation:
    name: Validate Confirmation Input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check confirmation string
        run: |
          expected="destroy-${{ github.event.inputs.environment }}"
          provided="${{ github.event.inputs.confirmation }}"
          if [ "$provided" != "$expected" ]; then
            echo "::error::Confirmation string '$provided' does not match required '$expected'. Aborting destroy."
            exit 1
          fi
          echo "Confirmation validated for environment: ${{ github.event.inputs.environment }}"

  plan-destroy:
    name: Terraform Destroy Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-confirmation
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION_INPUT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: ${{ runner.os }}-terraform-providers-${{ github.event.inputs.environment }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-${{ github.event.inputs.environment }}-
            ${{ runner.os }}-terraform-providers-

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="backend-configs/${{ github.event.inputs.environment }}.backend.hcl"

      - name: Terraform Plan Destroy
        run: |
          terraform plan -destroy \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="aws_region=${{ secrets.AWS_REGION || env.AWS_REGION_INPUT }}" \
            -var-file="tfvars/${{ github.event.inputs.environment }}.tfvars" \
            -out=tfplan

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tfplan-destroy-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 90

  apply-destroy:
    name: Terraform Destroy Apply
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan-destroy
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION_INPUT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: ${{ runner.os }}-terraform-providers-${{ github.event.inputs.environment }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-${{ github.event.inputs.environment }}-
            ${{ runner.os }}-terraform-providers-

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="backend-configs/${{ github.event.inputs.environment }}.backend.hcl"

      - name: Download destroy plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: tfplan-destroy-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply (Destroy)
        run: terraform apply tfplan

      - name: Verify destruction complete
        id: verify
        run: |
          remaining=$(terraform state list 2>/dev/null | wc -l)
          echo "remaining_resources=$remaining" >> "$GITHUB_OUTPUT"
          echo "Remaining resources in state: $remaining"

      - name: Clean up Terraform state (fully destroyed only)
        if: steps.verify.outputs.remaining_resources == '0'
        run: |
          echo "No resources remain in state. Removing local state artifacts."
          rm -f terraform.tfstate terraform.tfstate.backup tfplan
          echo "State cleanup complete for environment: ${{ github.event.inputs.environment }}"

      - name: Warn if resources remain
        if: steps.verify.outputs.remaining_resources != '0'
        run: |
          echo "::warning::${{ steps.verify.outputs.remaining_resources }} resource(s) still present in Terraform state. Skipping state cleanup — investigate before re-running."