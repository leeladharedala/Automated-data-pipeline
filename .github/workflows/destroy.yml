name: Destroy Energy ETL Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        type: choice
        options: [dev, staging, prod]
      confirmation:
        description: 'Type "destroy-<environment>" to confirm (e.g. destroy-dev)'
        required: true
        type: string
      remove_state:
        description: "Delete Terraform state from S3 after destroy?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_WORKING_DIR: infra
  TF_VAR_environment: ${{ github.event.inputs.environment }}
  STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  STATE_KEY: ${{ github.event.inputs.environment }}/terraform.tfstate

jobs:
  guard:
    name: Validate Destroy Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          EXPECTED="destroy-${{ github.event.inputs.environment }}"
          if [ "${{ github.event.inputs.confirmation }}" != "$EXPECTED" ]; then
            echo "Confirmation mismatch. Aborting."; exit 1
          fi

  plan-destroy:
    name: Terraform Destroy Plan
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065
        with:
          terraform_version: "1.9.8"
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=${{ env.STATE_KEY }}" -backend-config="region=${{ env.AWS_REGION }}" -input=false
      - name: Terraform Destroy Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -destroy -var="environment=${{ env.TF_VAR_environment }}" -out=tfplan-destroy -input=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tfplan-destroy-${{ env.TF_VAR_environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan-destroy

  apply-destroy:
    name: Terraform Apply Destroy
    runs-on: ubuntu-latest
    needs: plan-destroy
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065
        with:
          terraform_version: "1.9.8"
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=${{ env.STATE_KEY }}" -backend-config="region=${{ env.AWS_REGION }}" -input=false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: tfplan-destroy-${{ env.TF_VAR_environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}
      - name: Terraform Apply Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan-destroy